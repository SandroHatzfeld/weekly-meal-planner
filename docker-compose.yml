services:
  app:
    build: .
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mealplanner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mealplanner}
    volumes:
      - uploads:/app/data/uploads # hochgeladene Bilder
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3010}:3000" # vorher mit `sudo ss -tlnp` freien Host-Port prüfen
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mealplanner}
      - POSTGRES_USER=${POSTGRES_USER:-mealplanner}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mealplanner}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
